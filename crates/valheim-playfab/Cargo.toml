[package]
name = "valheim-playfab"
description = "The PlayFab REST calls a Valheim crossplay client makes: login and lobby lookup by join code"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls-native-roots"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror.workspace = true
tracing.workspace = true
